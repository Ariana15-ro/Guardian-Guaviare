name: Notificar focos de calor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/notificar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/notificar"
